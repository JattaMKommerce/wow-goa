---
deployment:
  tasks:
    - export DEPLOYPATH=/home/wowgoa/public_html
    - /bin/cp -R backend $DEPLOYPATH/
    - /bin/rm -f $DEPLOYPATH/backend/scratch_*.php
    - /bin/rm -f $DEPLOYPATH/backend/test_*.php
    - if [ -d "frontend/dist" ]; then /bin/cp -R frontend/dist/* $DEPLOYPATH/; fi
    - if [ -f ".htaccess" ]; then /bin/cp .htaccess $DEPLOYPATH/; fi
